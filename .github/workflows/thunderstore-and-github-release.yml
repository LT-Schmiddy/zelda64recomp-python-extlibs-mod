# To use this workflow, you need to perform some setup on GitHub first in your repository settings.
# * Under `Actions->General`, set "Workflow permissions" to "Read and write permissions"
# * Under `Secrets and Variables->Actions->Secrets`, Create a repository secret named THUNDERSTORE_SERVICE_TOKEN with your Thunderstore Service Account token.
# * Under `Secrets and Variables->Actions->Variables`, Create a repository variable named Compilation with your Thunderstore team name.
# * * Alternatively, you can just declare your Thunderstore team in this file in the `publish_thunderstore_release` step.
# * * HOWEVER, NEVER STORE YOUR THUNDERSTORE TOKEN IN THIS FILE. OTHERWISE, OTHER PEOPLE WILL BE ABLE TO UPLOAD MODS/UPDATES AS YOU.

name: Build and Publish mod
on:
  push:
    tags:
      - "release-*.*.*"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      id: checkout_repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Get Apt Packages
      id: get_apt_packages
      run: |-
        sudo apt install -y ninja-build jq zip doxygen

    - name: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14' 

    - name: Get Snap Packages
      id: get_snap_packages
      run: |-
        sudo snap install cmake --classic

    - name: Print Python Version
      id: print_python_version
      run: |-
        python3 --version

    - name: Run Buildscript
      id: run_buildscript
      run: |-
        python3 ./modbuild.py thunderstore

    - name: Upload Build Artifacts
      id: upload_build_artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ThunderstorePackage
        path: |
          ./*thunderstore.zip

    - name: Read MM Thunderstore Manifest
      id: read_mm_thunderstore_manifest
      run: |
        python3 ./modbuild.py manifest -n mm
        NAME=$(jq -r '.name' ${{ github.workspace }}/RecompExternalPython_for_Zelda64Recompiled.manifest.json)
        VERSION=$(jq -r '.version_number' ${{ github.workspace }}/RecompExternalPython_for_Zelda64Recompiled.manifest.json)
        DESCRIPTION=$(jq -r '.description' ${{ github.workspace }}/RecompExternalPython_for_Zelda64Recompiled.manifest.json)
        echo "name=$NAME" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"

    - name: Read BK Thunderstore Manifest
      id: read_bk_thunderstore_manifest
      run: |
        python3 ./modbuild.py manifest -n bk
        NAME=$(jq -r '.name' ${{ github.workspace }}/RecompExternalPython_for_BanjoRecompiled.manifest.json)
        VERSION=$(jq -r '.version_number' ${{ github.workspace }}/RecompExternalPython_for_BanjoRecompiled.manifest.json)
        DESCRIPTION=$(jq -r '.description' ${{ github.workspace }}/RecompExternalPython_for_BanjoRecompiled.manifest.json)
        echo "name=$NAME" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"

    # Remove this step if you don't want to publish to GitHub as well.
    - name: Publish Github Release
      id: publish_github_release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: Release ${{ steps.read_mm_thunderstore_manifest.outputs.version }}
        body_path: ./thunderstore_info/CHANGELOG.md
        files: |
          ./*thunderstore.zip
          ./include_in_dependents/*
        make_latest: true

